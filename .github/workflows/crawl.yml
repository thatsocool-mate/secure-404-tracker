name: Daily internal 404 check

on:
  schedule:
    - cron: '17 21 * * *'   # 02:17 Karachi time, every day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Crawl www.secure.com
        run: node crawl.mjs
      - name: Save results
        run: |
          git config user.name "secure-404-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "404 check $(TZ=Asia/Karachi date +%F)"
          git push
